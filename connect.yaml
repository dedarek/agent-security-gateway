# asg-connect probe — 本机开发配置
listen: "127.0.0.1:8181"

providers:
  - name: opencode-zen
    base_url: "https://opencode.ai/zen/go/v1"
    api_key: "${OPENCODE_GO_API_KEY}"
    default_model: "ox-alpha-free"

hub_url: "http://127.0.0.1:8090"   # central ASG gateway (ingest lives on the UI/API listener)
tenant_key: "dev-key"
tenant_name: "local"

event_spool_path: "./connect-events.jsonl"
