# asg-connect probe — 本机开发配置
# 实时判定(inline)用 Lenovo qwen35 (快速+免费)
# 事后分析(async)可以放宽到任何模型

listen: "127.0.0.1:8181"

providers:
  - name: opencode-zen
    base_url: "https://opencode.ai/zen/go/v1"
    api_key: "${OPENCODE_GO_API_KEY}"
    default_model: hy3
  - name: lenovo-qwen
    base_url: "https://aicloud-app.lenovo.com.cn/qwen38-27b/v1"
    api_key: "[REDACTED]"
    default_model: "qwen38-27b"
    allowed_models: ["qwen38-27b"]
    model_map:
      "qwen38-27b": "qwen38-27b"

hub_url: "http://127.0.0.1:8090"
tenant_key: "sk-alice-demo-key"
tenant_name: "local"

# 稳定运行时身份：会话和模型变化都归到这一个 Agent
agent_type: "opencode"
agent_alias: "本机 OpenCode"

event_spool_path: "./connect-events.jsonl"

# 语义扫描 LLM 后端: inline 用同一个免费快模型, max_tokens 限制到最小
semantic:
  llm_max_tokens: 100       # inline 判定要快, 只需要 YES/NO + 一句话理由
  async_llm_max_tokens: 0   # 0 = 不限 (事后分析模式)
