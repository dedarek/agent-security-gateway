<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Agent Security Gateway — SOC</title>
<style>
:root{--bg:#0b0f19;--panel:#111827;--card:#1e293b;--border:#334155;--fg:#f1f5f9;--dim:#94a3b8;--ok:#22c55e;--warn:#eab308;--bad:#ef4444;--accent:#3b82f6;--purple:#a855f7}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 Inter,system-ui,-apple-system,sans-serif}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--border)}
.hdr h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px 24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center}
.stat-num{font-size:28px;font-weight:700}.stat-label{font-size:11px;color:var(--dim);text-transform:uppercase;margin-top:4px}
.main{display:grid;grid-template-columns:280px 1fr 300px;gap:14px;padding:0 24px 24px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.ph{padding:10px 14px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.pb{padding:8px;max-height:400px;overflow-y:auto}.pb::-webkit-scrollbar{width:5px}.pb::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.si{padding:8px 10px;border-radius:6px;cursor:pointer;margin-bottom:3px;transition:all .1s}
.si:hover,.si.on{background:var(--card)}.si.on{outline:1px solid var(--accent)}
.sn{font-weight:600;font-size:12px}.sm{font-size:10px;color:var(--dim);margin-top:2px}
.bdg{display:inline-block;padding:1px 7px;border-radius:9px;font-size:9px;font-weight:700}
.b-ALLOW{background:rgba(34,197,94,.15);color:var(--ok)}.b-BLOCK{background:rgba(239,68,68,.15);color:var(--bad)}
.b-REDACT{background:rgba(234,179,8,.15);color:var(--warn)}.b-CONFIRM{background:rgba(59,130,246,.15);color:var(--accent)}
.tl-ev{padding:8px 10px;margin:6px 0;background:var(--card);border-radius:6px;border-left:3px solid var(--border);font-size:12px}
.tl-ev.BLOCK{border-left-color:var(--bad)!important}.tl-ev.ALLOW{border-left-color:var(--ok)!important}
.tl-ev.REDACT{border-left-color:var(--warn)!important}.tl-ev.CONFIRM{border-left-color:var(--accent)!important}
.tl-t{font-family:monospace;font-weight:600;font-size:12px}.tl-r{color:var(--dim);margin-top:2px;font-size:11px}
.apr-c{background:var(--card);border:1px solid var(--warn);border-radius:6px;padding:10px;margin-bottom:6px}
.btn{padding:4px 12px;border:none;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;margin-right:4px}
.btn-g{background:var(--ok);color:#000}.btn-r{background:var(--bad);color:#fff}.btn-n{background:var(--border);color:var(--fg)}
.cc{background:var(--card);border:1px solid var(--purple);border-radius:6px;padding:8px;margin-bottom:6px;font-size:11px}
.inp{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--fg);border-radius:5px;padding:5px 8px;font-size:11px}
.empty{text-align:center;padding:20px;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<div class="hdr"><h1>🛡 Agent Security Gateway</h1><span style="font-size:11px;color:var(--dim)" id="clock"></span></div>
<div class="stats" id="stats"></div>
<div class="main">
<div>
<div class="panel" style="margin-bottom:10px"><div class="ph">Sessions</div><div class="pb" style="max-height:200px" id="ss"></div></div>
<div class="panel" style="margin-bottom:10px"><div class="ph">⚠ Approvals <span id="apc"></span></div><div class="pb" id="apr"></div></div>
<div class="panel"><div class="ph">Attack Clusters</div><div class="pb" id="clu"></div></div>
</div>
<div class="panel">
<div class="ph">Trajectory — <span id="cur-s" style="color:var(--accent)">select a session</span></div>
<div class="pb" style="max-height:500px" id="traj"><div class="empty">← Select a session</div></div>
<div id="rc" style="padding:12px"></div>
</div>
<div>
<div class="panel" style="margin-bottom:10px"><div class="ph">MCP Registry</div><div class="pb">
<input id="rn" placeholder="name" class="inp" style="margin-bottom:4px"><input id="rc2" placeholder="command/url" class="inp" style="margin-bottom:4px"><button onclick="addReg()" class="btn btn-g">Add Tool</button><div id="regl" style="margin-top:6px"></div></div></div>
<div class="panel"><div class="ph">Knowledge Graph</div><div class="pb">
<a href="/explorer/" target="_blank" style="color:var(--accent);font-size:11px;display:block;margin-bottom:8px">🌐 Open Graph Explorer →</a>
<input id="kgq" placeholder="Ask the graph..." class="inp" onkeydown="if(event.key==='Enter')kgA()"><button onclick="kgA()" class="btn btn-g" style="margin-top:4px;width:100%">Ask</button><div id="kgo" style="margin-top:6px"></div></div></div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
window.onerror=function(m,u,l){console.error('JS Error:',m,'line',l)};
async function j(url,opt){
  try{
    const r=await fetch(url,{...opt,credentials:'include'});
    if(r.status===401){
      document.body.innerHTML=`<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#0b0f19">
        <div style="background:#161b22;border:1px solid #334155;border-radius:10px;padding:32px;width:320px;text-align:center">
          <h2 style="color:#f1f5f9;font-size:16px;margin-bottom:16px">🛡 ASG Login</h2>
          <input type="password" id="pw" placeholder="Password" style="width:100%;box-sizing:border-box;background:#0a0e14;border:1px solid #334155;color:#f1f5f9;border-radius:6px;padding:8px 12px;margin-bottom:8px">
          <button onclick="doLogin()" style="width:100%;background:#238636;color:#fff;border:none;border-radius:6px;padding:8px;font-weight:600;cursor:pointer">Login</button>
          <div id="err" style="color:#ef4444;font-size:12px;margin-top:8px"></div>
        </div></div>`;
      window.doLogin=async function(){
        const pw=document.getElementById('pw').value;
        const r=await fetch('/api/ui-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
        if(r.ok)location.reload();
        else document.getElementById('err').textContent='Wrong password';
      };
      return null;
    }
    if(!r.ok){console.error('API error:',url,r.status);return null}
    return await r.json();
  }catch(e){console.error('fetch failed:',url,e);return null}
}
let sel=null,lastApr=0;

async function loadStats(){
  const[ss,ev]=await Promise.all([j('/api/sessions'),j('/api/events')]);
  if(!ss||!ev)return;
  const t=ss.reduce((a,s)=>a+s.events,0);
  const b=ev.filter(e=>e.Decision?.Final==='BLOCK').length;
  const r=ev.filter(e=>e.Decision?.Final==='REDACT').length;
  $('stats').innerHTML=
    `<div class="stat-card"><div class="stat-num">${t}</div><div class="stat-label">Total Events</div></div>`+
    `<div class="stat-card"><div class="stat-num" style="color:var(--bad)">${ev.filter(e=>e.Decision?.Final==='BLOCK').length}</div><div class="stat-label">Blocked</div></div>`+
    `<div class="stat-card"><div class="stat-num" style="color:var(--warn)">${r}</div><div class="stat-label">Redacted</div></div>`+
    `<div class="stat-card"><div class="stat-num" style="color:var(--accent)">${ss.length}</div><div class="stat-label">Sessions</div></div>`;
}
async function loadSS(){
  const ss=await j('/api/sessions');if(!ss)return;$('ss').innerHTML='';
  ss.forEach(s=>{const li=document.createElement('div');li.className='si'+(s.session_id===sel?' on':'');
    li.innerHTML=`<div class="sn">${s.session_id}</div><div class="sm"><span class="bdg b-${s.last_verdict}">${s.last_verdict}</span> ${s.events} events</div>`;
    li.onclick=()=>{sel=s.session_id;loadTj();loadSS()};$('ss').appendChild(li)});
}
async function loadTj(){
  if(!sel)return;$('cur-s').textContent=sel;
  const d=await j('/api/trajectory?session='+encodeURIComponent(sel));if(!d)return;
  const box=$('traj');box.innerHTML='';
  (d.events||[]).forEach(e=>{
    const v=e.Decision.Final;const el=document.createElement('div');el.className='tl-ev '+v;
    el.innerHTML=`<div class="tl-t">${e.Call.ToolID}</div><div style="margin:3px 0"><span class="bdg b-${v}">${v}</span> risk=${e.Decision.Risk||0}</div><div class="tl-r">${(e.Decision.Rationale||'').replace(/</g,'&lt;')}</div>`;
    box.appendChild(el)});
  const sug=d.suggestion;if(!sug)return;
  let h=`<div style="border-top:1px solid var(--border);padding-top:10px"><b style="color:var(--bad)">Root Cause:</b><br>${sug.root_cause}</div>`;
  if(sug.chain?.length)h+='<div style="background:var(--bg);padding:8px;margin:6px 0;font-family:monospace;font-size:11px">'+sug.chain.map(c=>'→ '+c).join('<br>')+'</div>';
  if(sug.cedar_policy){
    h+='<pre style="background:var(--bg);padding:8px;border-radius:4px;font-size:10px;overflow-x:auto;color:#a5d6ff;margin:6px 0">'+sug.cedar_policy.replace(/</g,'&lt;')+'</pre>';
    if(sug.status==='open')h+=`<button class="btn btn-g" onclick="acc('${sug.id}')">✓ Accept & Deploy</button><button class="btn btn-r" onclick="dis('${sug.id}')">Dismiss</button>`;
    else h+=`<span class="bdg b-${sug.status==='accepted'?'ALLOW':'BLOCK'}">${sug.status}</span>`;
  }
  $('rc').innerHTML=h;
}
async function acc(id){await j('/api/suggestion/decide',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,accept:true})});loadTj()}
async function dis(id){await j('/api/suggestion/decide',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,accept:false})});loadTj()}
async function loadApr(){
  const l=await j('/api/approvals');const bx=$('apr');
  $('apc').textContent=l?.length?`(${l.length})`:'';
  if(!l?.length){bx.innerHTML='<div class="empty">No pending approvals</div>';return}
  bx.innerHTML='';
  l.forEach(a=>{const d=document.createElement('div');d.className='apr-c';
    d.innerHTML=`<b>${a.ToolID}</b> risk=${a.Risk}<div style="color:var(--dim);font-size:11px;margin:3px 0">${a.Reason}</div><button class="btn btn-g" onclick="vt('${a.ID}',true)">Approve</button><button class="btn btn-r" onclick="vt('${a.ID}',false)">Deny</button>`;
    bx.appendChild(d)});
}
async function vt(id,ap){await j('/api/approvals',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,approve:ap})});loadApr()}
async function loadClu(){
  const cs=await j('/api/clusters');const bx=$('clu');
  if(!cs?.length){bx.innerHTML='<div class="empty">No clusters</div>';return}
  bx.innerHTML='';
  cs.forEach(c=>{bx.innerHTML+=`<div class="cc"><b>[${c.count}x]</b> ${c.pattern}<br><span style="color:var(--dim)">${c.sessions.join(', ')}</span></div>`});
}
async function addReg(){/* stub */}
async function delReg(n){}
async function kgA(){
  const q=$('kgq').value;if(!q)return;$('kgo').innerHTML='<div class="empty">Thinking...</div>';
  const r=await j('/api/kg/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});
  $('kgo').innerHTML=r?.answer?`<div style="background:rgba(168,85,247,.08);border:1px solid rgba(168,85,247,.2);border-radius:6px;padding:8px;font-size:12px">${r.answer}</div>`:'';
}
.then(()=>{console.log('initial load complete')});
Promise.all([loadStats(),loadSS(),loadApr(),loadClu()]);
setInterval(()=>{loadStats();loadApr();loadClu()},4000);
setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString()},1000);
</script>
</body></html>
