# Agent Security Gateway — development configuration.
# Every field is optional; missing fields keep their defaults (see
# internal/config/config.go Default()).

listen: ":8080"

# Real upstream MCP server the gateway proxies to (argv, spawned over stdio).
upstream_command: ["./bin/upstream-mcp"]

cedar_policy_path: "./deploy/policies/permission.cedar"
rules_path: "./deploy/rules/pipelock-community.yaml"

# Behavior/causal axis: content-based taint sources and egress sinks
# (unqualified tool names).
taint_sources: ["get_inbox", "read_secret", "fetch", "read_file"]
taint_sinks:   ["send_email", "http_post", "export_all_users"]

include_experimental_rules: false
# extra_trusted_keys_hex: ""   # optional third-party rule signers

# Behavior sidecar (Invariant analyzer). Empty => engine disabled.
behavior_sidecar_url: ""
behavior_fail_open: true
